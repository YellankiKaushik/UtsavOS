name: UtsavOS verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:concurrency
      - run: npm run api:generate
      - run: npm run db:types
      - run: git diff --exit-code docs/api/openapi.yaml src/generated/database.types.ts
      - run: npm run build
      - run: npm run security:client
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6.0.0 (Node 24)
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run showcase:test
      - run: npm run showcase:build
      - run: npx playwright install --with-deps chromium
      - run: npm run showcase:e2e:offline
  supabase-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset --local
      - run: npx supabase test db
      - run: npx supabase stop
        if: always()
